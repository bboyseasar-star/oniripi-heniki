<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このアプリについて</title><style>
:root{--ink:#1f2937;--blue:#1d4ed8;--line:#dbe3ef;--bg:#f3f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.75}main{max-width:820px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.button{display:inline-block;padding:10px 14px;border-radius:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;min-height:44px}.back{background:#e8eef9;color:#1e3a5f}.lead{background:#eef6ff;border-radius:10px;padding:12px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:22px 0 18px}.tab{border:0;border-radius:10px 10px 0 0;padding:11px 14px;background:#edf2f8;color:#334155;font:inherit;font-weight:700;cursor:pointer}.tab[aria-selected="true"]{background:var(--blue);color:#fff}.panel[hidden]{display:none}.doc{overflow-wrap:anywhere}.doc h3{font-size:20px;margin:24px 0 8px}.doc h4{font-size:17px;margin:20px 0 6px}.doc p{margin:8px 0}.doc ul{margin:8px 0;padding-left:1.5em}.license{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fbfdff;font-size:14px}.error{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px}footer{text-align:center;margin-top:28px}</style></head>
<body><main><a class="button back" href="./">← ホーム画面に戻る</a><div class="card"><h1>このアプリについて</h1><p class="lead">このページは、アプリを安心して使うためのお知らせです。読み終えたらホーム画面に戻れます。</p><div class="tabs" role="tablist" aria-label="表示する内容"><button class="tab" role="tab" id="terms-tab" aria-controls="terms-panel" aria-selected="true">利用条件・出典</button><button class="tab" role="tab" id="license-tab" aria-controls="license-panel" aria-selected="false">ライセンス</button></div><section id="terms-panel" class="panel" role="tabpanel" aria-labelledby="terms-tab"><div id="notice" class="doc" aria-live="polite">読み込み中です…</div></section><section id="license-panel" class="panel" role="tabpanel" aria-labelledby="license-tab" hidden><p>アプリを改変・配布する場合は、次の正式なライセンス本文を確認してください。</p><div id="license" class="license" aria-live="polite">読み込み中です…</div></section><footer><a class="button" href="./">← ホーム画面に戻る</a></footer></div></main>
<script>const plain=s=>s.replace(/\*\*/g,"").replace(new RegExp(String.fromCharCode(96),"g"),"").trim();const append=(el,text)=>{let p=0;const re=/\[([^\]]+)\]\((https?:\/\/[^\s)]+|(?:\.\/)?[A-Za-z0-9][A-Za-z0-9._-]*)\)/g;for(let m;(m=re.exec(text));){el.append(document.createTextNode(text.slice(p,m.index)));const a=document.createElement("a");a.href=m[2];if(/^https?:/.test(m[2])){a.target="_blank";a.rel="noopener"}a.textContent=m[1];el.append(a);p=re.lastIndex}el.append(document.createTextNode(text.slice(p)))};const renderNotice=text=>{const root=document.querySelector("#notice");root.replaceChildren();let list;for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line){list=null;continue}const h=line.match(/^(#{1,6})\s+(.+)/),b=line.match(/^[-*]\s+(.+)/);if(h){const e=document.createElement(h[1].length===1?"h3":"h4");append(e,plain(h[2]));root.append(e);list=null}else if(b){if(!list){list=document.createElement("ul");root.append(list)}const e=document.createElement("li");append(e,plain(b[1]));list.append(e)}else{const e=document.createElement("p");append(e,plain(line));root.append(e);list=null}}};const load=async(p,id,render)=>{const e=document.querySelector(id);try{const r=await fetch(p);if(!r.ok)throw Error();render(await r.text())}catch{e.textContent="本文を表示できませんでした。ホーム画面に戻って、もう一度開いてください。";e.classList.add("error")}};load("NOTICE.md","#notice",renderNotice);load("LICENSE","#license",t=>document.querySelector("#license").textContent=t);for(const tab of document.querySelectorAll(".tab"))tab.addEventListener("click",()=>{const terms=tab.id==="terms-tab";document.querySelector("#terms-panel").hidden=!terms;document.querySelector("#license-panel").hidden=terms;document.querySelector("#terms-tab").setAttribute("aria-selected",terms);document.querySelector("#license-tab").setAttribute("aria-selected",!terms)});</script></body></html>
